<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UK Boulders</title>
  <meta name="description" content="Outdoor bouldering areas across the UK, with photos and nearby parking." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#2f6b4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Boulders" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="UK Boulders home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M4 26c0-6 3-12 8-15 2-1.2 3.6-1 5 .3l2.2 2c.9.8 2.2 1 3.3.4 2.8-1.4 5.5 1.6 5.5 5.3V26H4z"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M2 27.5h28"/></svg>
      <h1>UK Boulders</h1>
    </a>
    <p class="tagline">Crags, conditions, problems &amp; parking</p>
  </header>
  <div id="offline" class="offline-banner" role="status" hidden>
    You're offline. Showing saved crags, problems, walk-ins and the last forecast; map areas you've viewed before still work.
  </div>

  <main class="layout">
    <aside class="sidebar">
      <!-- List view -->
      <section id="list-view">
        <div class="filters">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Search crags, regions, rock…" aria-label="Search crags" />
          </div>
          <select id="region" aria-label="Filter by region">
            <option value="">Region</option>
          </select>
          <select id="rock" aria-label="Filter by rock type">
            <option value="">Rock</option>
          </select>
          <select id="list-sort" aria-label="Sort areas">
            <option value="name">A–Z</option>
            <option value="driest">Driest now</option>
          </select>
        </div>
        <p id="count" class="count"></p>
        <ul id="area-list" class="area-list"></ul>
      </section>

      <!-- Detail view -->
      <section id="detail-view" hidden>
        <button id="back" class="back" type="button" aria-label="Back to all crags">← All crags</button>
        <div id="detail"></div>
      </section>
    </aside>

    <div id="map" class="map" role="region" aria-label="Map of bouldering areas"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
